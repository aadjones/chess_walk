name: Keep Alive

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours at 00:00 and 12:00 UTC
  workflow_dispatch:  # Allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: curl -s -o /dev/null -w "%{http_code}" https://chesswalk.streamlit.app/
